<!DOCTYPE html>
<html>
<head>
    <title>BuyNest - OTP Verification</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }
        .navbar {
            height: 70px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        .logo { font-size: 24px; font-weight: bold; }
        .wrapper {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .card {
            width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; }
        .subtitle { color: #777; line-height: 1.5; margin-bottom: 28px; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
            font-size: 20px;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">BuyNest</div>
    </div>

    <div class="wrapper">
        <div class="card">
            <h1>Verify OTP</h1>
            <p class="subtitle">Enter the 6-digit OTP sent to your registered email address.</p>

            <form method="POST">
                <input
                    type="text"
                    name="otp"
                    placeholder="000000"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    required
                >

                <button type="submit">Verify OTP</button>
            </form>
        </div>
    </div>
</body>
</html>
