
<!DOCTYPE html>
<html>
<head>
    <title>BuyNest</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#222}
        nav{background:#111827;color:white;padding:15px 5%;display:flex;gap:20px;align-items:center}
        nav a{color:white;text-decoration:none}
        .container{width:90%;max-width:1200px;margin:30px auto}
        .card{background:white;padding:25px;border-radius:12px;box-shadow:0 3px 15px #0001;margin-bottom:20px}
        input,select,textarea{width:100%;padding:11px;margin:7px 0 15px;border:1px solid #ddd;border-radius:7px;box-sizing:border-box}
        button,.btn{background:#111827;color:white;border:0;padding:10px 16px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block}
        .danger{background:#dc2626}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
        .product img{width:100%;height:200px;object-fit:contain;border-radius:8px;background:#f8fafc}
        .price{font-size:20px;font-weight:bold}
        table{width:100%;border-collapse:collapse;background:white}
        th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
        .actions{display:flex;gap:8px;flex-wrap:wrap}
    </style>
</head>
<title>BuyNest - Profile</title></head><body>
<nav><b>BuyNest</b><a href="/user/dashboard">Products</a><a href="/user/cart">Cart</a><a href="/user/orders">Orders</a><a href="/user/logout">Logout</a></nav>
<div class="container">
<div class="card">
<h2>User Profile</h2>
{% if user.profile_image %}
<img src="{{ url_for('static', filename='uploads/' + user.profile_image) }}" style="width:120px;height:120px;object-fit:cover;border-radius:50%">
{% endif %}
<form method="POST" action="/user/profile/image" enctype="multipart/form-data">
<input type="file" name="profile_image" accept="image/*" required>
<button>Upload Profile Image</button>
</form>
<hr>
<form method="POST" action="/user/profile/update">
<label>Name</label><input name="name" value="{{ user.name }}" required>
<label>Email</label><input type="email" name="email" value="{{ user.email }}" required>
<button>Update Profile</button>
</form>
</div></div>
</body></html>
