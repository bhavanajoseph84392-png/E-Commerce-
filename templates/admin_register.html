<!DOCTYPE html>
<html>
<head>
    <title>BuyNest - Admin Registration</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }
        .navbar {
            height: 70px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        .logo { font-size: 24px; font-weight: bold; }
        .nav-link { text-decoration: none; color: #222; font-weight: 600; }
        .wrapper {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .card {
            width: 450px;
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; margin-bottom: 8px; }
        .subtitle { color: #777; margin-bottom: 28px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .bottom-link { text-align: center; margin-top: 20px; }
        a { color: #222; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">BuyNest</div>
        <a class="nav-link" href="{{ url_for('admin_login') }}">Login</a>
    </div>

    <div class="wrapper">
        <div class="card">
            <h1>Admin Registration</h1>
            <p class="subtitle">Create your administrator account.</p>

            <form method="POST">
                <label>Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>

                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email" required>

                <label>Password</label>
                <input type="password" name="password" placeholder="Create password" required>

                <button type="submit">Register</button>
            </form>

            <div class="bottom-link">
                Already registered?
                <a href="{{ url_for('admin_login') }}">Login</a>
            </div>
        </div>
    </div>
</body>
</html>
