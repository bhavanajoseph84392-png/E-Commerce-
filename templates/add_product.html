<!DOCTYPE html>
<html>

<head>

    <title>BuyNest - Add Product</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .navbar {
            height: 70px;
            background: white;

            display: flex;
            align-items: center;

            padding: 0 35px;

            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 25px;

            padding: 12px 25px;

            border: none;

            border-radius: 6px;

            background: #222;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #222;
        }

    </style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        🛒 BuyNest
    </div>

</div>


<div class="container">

    <div class="card">

        <h1>Add Product</h1>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <label>
                Product Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter product name"
                required
            >


            <label>
                Description
            </label>

            <textarea
                name="description"
                placeholder="Enter product description"
                required
            ></textarea>


            <label>
                Price
            </label>

            <input
                type="number"
                name="price"
                step="0.01"
                placeholder="Enter price"
                required
            >


            <label>
                Category
            </label>

            <select
                name="category"
                required
            >

                <option value="">
                    Select Category
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="Mobiles">
                    Mobiles
                </option>

                <option value="Laptops">
                    Laptops
                </option>

                <option value="Fashion">
                    Fashion
                </option>

                <option value="Home">
                    Home
                </option>

                <option value="Accessories">
                    Accessories
                </option>

            </select>


            <label>
                Stock
            </label>

            <input
                type="number"
                name="stock"
                min="0"
                placeholder="Enter stock quantity"
                required
            >


            <label>
                Product Image
            </label>

            <input
                type="file"
                name="image"
                accept=".jpg,.jpeg,.png,.gif,.webp"
                required
            >


            <button type="submit">
                Add Product
            </button>

        </form>


        <a
            class="back"
            href="{{ url_for('products') }}"
        >
            ← View Products
        </a>

    </div>

</div>

</body>

</html>
