<!DOCTYPE html>
<html>
<head>
    <title>BuyNest - Admin Profile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }
        .navbar {
            height: 70px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        .logo { font-size: 24px; font-weight: bold; }
        .admin-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-info { text-align: right; }
        .admin-name { font-weight: bold; font-size: 15px; }
        .admin-email { font-size: 12px; color: #777; }
        .profile-image, .default-profile {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }
        .profile-image { object-fit: cover; border: 2px solid #ddd; }
        .default-profile {
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }
        .sidebar {
            width: 230px;
            background: #222;
            padding: 25px 15px;
        }
        .sidebar a {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 5px;
        }
        .sidebar a:hover { background: #444; }
        .main-content {
            flex: 1;
            padding: 35px;
        }
        .card {
            max-width: 750px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            margin-bottom: 25px;
        }
        h1, h2 { margin-top: 0; }
        .current-photo { text-align: center; margin-bottom: 25px; }
        .large-profile-image, .large-default-profile {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }
        .large-profile-image { object-fit: cover; border: 4px solid #eee; }
        .large-default-profile {
            margin: auto;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 15px;
        }
        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 6px;
            background: #222;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }
        .upload-box {
            border: 1px dashed #bbb;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">BuyNest Admin Dashboard</div>

    <div class="admin-profile">
        <div class="admin-info">
            <div class="admin-name">{{ admin.name }}</div>
            <div class="admin-email">{{ admin.email }}</div>
        </div>

        {% if admin.profile_image %}
            <img
                class="profile-image"
                src="{{ url_for('static', filename='uploads/' + admin.profile_image) }}"
                alt="Admin Profile"
            >
        {% else %}
            <div class="default-profile">👤</div>
        {% endif %}
    </div>
</div>

<div class="container">

    <div class="sidebar">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_profile') }}">My Profile</a>
        <a href="#">Products</a>
        <a href="#">Orders</a>
        <a href="#">Users</a>
        <a href="{{ url_for('admin_logout') }}">Logout</a>
    </div>

    <div class="main-content">

        <div class="card current-photo">
            <h1>Admin Profile</h1>

            {% if admin.profile_image %}
                <img
                    class="large-profile-image"
                    src="{{ url_for('static', filename='uploads/' + admin.profile_image) }}"
                    alt="Admin Profile"
                >
            {% else %}
                <div class="large-default-profile">👤</div>
                <p>No profile image uploaded.</p>
            {% endif %}
        </div>

        <div class="card">
            <h2>Update Profile</h2>

            <form method="POST" action="{{ url_for('update_profile') }}">

                <label>Name</label>
                <input
                    type="text"
                    name="name"
                    value="{{ admin.name }}"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    value="{{ admin.email }}"
                    required
                >

                <button type="submit">Update Profile</button>

            </form>
        </div>

        <div class="card">
            <h2>Upload Profile Image</h2>

            <div class="upload-box">
                <form
                    method="POST"
                    action="{{ url_for('upload_profile_image') }}"
                    enctype="multipart/form-data"
                >
                    <input
                        type="file"
                        name="profile_image"
                        accept=".jpg,.jpeg,.png,.gif,.webp"
                        required
                    >

                    <button type="submit">Upload Image</button>
                </form>
            </div>
        </div>

    </div>
</div>

</body>
</html>
